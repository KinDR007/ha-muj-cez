get_documents:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: muj_cez
    date_from:
      example: "2025-01-01"
      selector:
        date:
    date_to:
      example: "2025-12-31"
      selector:
        date:
    document_type:
      example: "Faktura"
      selector:
        text:
    contract:
      example: "12345678"
      selector:
        text:
    unpaid_only:
      default: false
      selector:
        boolean:
    limit:
      default: 100
      selector:
        number:
          min: 1
          max: 1000
          mode: box

